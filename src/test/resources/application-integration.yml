spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Disable Docker Compose auto-start during tests
  docker:
    compose:
      enabled: false

  # Disable Redis for integration tests (use in-memory stub)
  data:
    redis:
      host: localhost
      port: 6379

# JWT Config (test-only secret)
jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1pbnRlZ3JhdGlvbi10ZXN0cy1vbmx5LTEyMzQ1Njc4OTAxMjM0NTY3ODkw
  expiration-ms: 3600000

# Biller config
biller:
  fee:
    flat-amount: 50
