spring:
  application:
    name: fintech-ewallet

server:
  port: 8080
  servlet:
    context-path: /

# ─── JWT Configuration ───────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:default-dev-secret-must-change-in-production-at-least-64-chars-long}
  expiration: 3600000 # 1 hour (ms)
  refresh-expiration: 604800000 # 7 days (ms)

# ─── Actuator & Monitoring ───────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# ─── SpringDoc / Swagger ─────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ─── Flyway ──────────────────────────────────────────────────
spring.flyway:
  enabled: true
  locations: classpath:db/migration
