# ─── Test Profile ────────────────────────────────────────────
# Uses H2 in-memory for fast unit tests.
# Integration tests use Testcontainers (real PostgreSQL).

spring:
  datasource:
    url: jdbc:h2:mem:ewallet_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false # Don't start Docker in tests

logging:
  level:
    com.fintech.ewallet: WARN
