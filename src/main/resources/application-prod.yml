# ─── Production Profile ──────────────────────────────────────
# All sensitive values MUST come from environment variables.

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Fix: Render uses PgBouncer which does not support PostgreSQL prepared
    # statements in transaction pooling mode. Setting prepareThreshold=0
    # disables prepared statement caching entirely, preventing the
    # "prepared statement already exists" Flyway error on startup.
    hikari:
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  docker:
    compose:
      enabled: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.fintech.ewallet: INFO
    org.springframework.security: WARN

management:
  endpoint:
    health:
      show-details: when_authorized
