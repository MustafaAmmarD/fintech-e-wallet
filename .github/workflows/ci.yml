name: Java CI/CD Pipeline

# When should this pipeline run?
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    # Run on the latest Ubuntu Linux server provided by GitHub
    runs-on: ubuntu-latest

    # We need a PostgreSQL database for our Integration Tests!
    # GitHub will automatically start this container before running our code.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ewallet_dev
          POSTGRES_USER: ewallet
          POSTGRES_PASSWORD: ewallet_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Download our code from the GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Java 21 on the Ubuntu server
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven # Caches downloaded dependencies to make builds faster

      # Step 3: Run ALL our tests (Unit, Integration, Controller)
      - name: Run Tests with Maven
        run: ./mvnw test

      # Step 4: If tests pass, build the final .jar file
      - name: Build Project
        run: ./mvnw clean package -DskipTests
