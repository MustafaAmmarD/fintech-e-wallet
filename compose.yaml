# ─── Docker Compose for Local Development ────────────────────
# Spring Boot 3.2+ auto-starts this when running with 'dev' profile.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ewallet-postgres
    environment:
      POSTGRES_DB: ewallet_dev
      POSTGRES_USER: ewallet
      POSTGRES_PASSWORD: ewallet_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ewallet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewallet -d ewallet_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ewallet_pgdata:
